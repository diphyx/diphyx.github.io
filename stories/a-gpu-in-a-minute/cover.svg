<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 -165 1080 1080" role="img" aria-label="A one-minute dial around a GPU chip, with sign in, credit and machine as the three steps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f0f5fa"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a00"/><stop offset=".5" stop-color="#ffcf1a"/><stop offset="1" stop-color="#00c2ff"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00c2ff" stop-opacity=".18"/><stop offset="1" stop-color="#00c2ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0a2540" stroke-opacity=".05"/></pattern>
  </defs>
  <rect x="0" y="-225" width="1200" height="1200" fill="url(#bg)"/>
  <rect x="0" y="-225" width="1200" height="1200" fill="url(#grid)"/>
  <circle cx="800" cy="375" r="330" fill="url(#halo)"/>
  <!-- steps -->
  <g font-family="SUSE, system-ui, sans-serif" fill="#0a2540">
    <g transform="translate(120 200)">
      <circle cx="22" cy="22" r="22" fill="#fff" stroke="#0a2540" stroke-width="3"/><text x="22" y="29" text-anchor="middle" font-size="18" font-weight="700">1</text>
      <text x="64" y="20" font-size="22" font-weight="700">Sign in</text><text x="64" y="46" font-size="16" fill="#6b7c93">Google, GitHub or LinkedIn</text>
    </g>
    <path d="M142 250 V300" stroke="#0a2540" stroke-opacity=".2" stroke-width="3" stroke-dasharray="4 8"/>
    <g transform="translate(120 320)">
      <circle cx="22" cy="22" r="22" fill="#fff" stroke="#0a2540" stroke-width="3"/><text x="22" y="29" text-anchor="middle" font-size="18" font-weight="700">2</text>
      <text x="64" y="20" font-size="22" font-weight="700">Add credit</text><text x="64" y="46" font-size="16" fill="#6b7c93">Prepaid, billed by the hour</text>
    </g>
    <path d="M142 370 V420" stroke="#0a2540" stroke-opacity=".2" stroke-width="3" stroke-dasharray="4 8"/>
    <g transform="translate(120 440)">
      <circle cx="22" cy="22" r="22" fill="url(#g)" stroke="none"/><text x="22" y="29" text-anchor="middle" font-size="18" font-weight="700">3</text>
      <text x="64" y="20" font-size="22" font-weight="700">Pick a machine</text><text x="64" y="46" font-size="16" fill="#6b7c93">AWS, Google Cloud or Azure</text>
    </g>
  </g>
  <!-- dial -->
  <g transform="translate(800 375)">
    <circle r="230" fill="#fff" fill-opacity=".7" stroke="#0a2540" stroke-opacity=".12" stroke-width="2"/>
    <g stroke="#0a2540" stroke-opacity=".25" stroke-width="2" stroke-linecap="round">
      <path d="M0 -212v-10" transform="rotate(0)"/><path d="M0 -212v-10" transform="rotate(30)"/><path d="M0 -212v-10" transform="rotate(60)"/><path d="M0 -212v-10" transform="rotate(90)"/><path d="M0 -212v-10" transform="rotate(120)"/><path d="M0 -212v-10" transform="rotate(150)"/><path d="M0 -212v-10" transform="rotate(180)"/><path d="M0 -212v-10" transform="rotate(210)"/><path d="M0 -212v-10" transform="rotate(240)"/><path d="M0 -212v-10" transform="rotate(270)"/><path d="M0 -212v-10" transform="rotate(300)"/><path d="M0 -212v-10" transform="rotate(330)"/>
    </g>
    <!-- sweep: almost a full minute -->
    <path d="M0 -200 A200 200 0 1 1 -104 171" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-104" cy="171" r="9" fill="#00c2ff"/>
    <!-- chip -->
    <rect x="-80" y="-70" width="160" height="140" rx="16" fill="#fff" stroke="#0a2540" stroke-width="3"/>
    <rect x="-46" y="-40" width="92" height="80" rx="10" fill="none" stroke="url(#g)" stroke-width="4"/>
    <g stroke="#0a2540" stroke-width="3" stroke-linecap="round" stroke-opacity=".5"><path d="M-40 -70v-18M0 -70v-18M40 -70v-18M-40 70v18M0 70v18M40 70v18M-80 -30h-18M-80 0h-18M-80 30h-18M80 -30h18M80 0h18M80 30h18"/></g>
    <text y="8" text-anchor="middle" font-family="SUSE Mono, Menlo, monospace" font-size="20" font-weight="600" fill="#0a2540">GPU</text>
    <text y="128" text-anchor="middle" font-family="SUSE, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#6b7c93">~1 MIN</text>
  </g>
</svg>
